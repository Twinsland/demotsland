<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Twinsland - Entrez dans l'aventure</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="landing-page">
  <div class="intro-overlay">
    <img src="assets/images/logo-twinsland.png" alt="Twinsland Logo" class="logo">
    <h1>Bienvenue à Twinsland</h1>
    <p class="slogan">Explorez, collectionnez, vibrez au rythme du Bénin</p>
    <button onclick="window.location.href='carte.html'" class="start-btn">Commencer l'aventure</button>
  </div>

<div class="music-player">
  <div class="player-info">
    <span id="track-name">Titre</span> | <span id="artist-name">Artiste</span>
  </div>
  <div class="player-controls">
    <button id="prev-btn">&#10094;</button>
    <button id="play-btn">&#9654;</button>
    <button id="next-btn">&#10095;</button>
  </div>
  <audio id="audio" loop></audio>
</div>

  <video autoplay muted loop id="bg-video">
    <source src="assets/videos/intro-twinsland.mp4" type="video/mp4">
    Votre navigateur ne supporte pas la vidéo de fond.
  </video>
</body>
</html>
