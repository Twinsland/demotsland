<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Twinsland Map</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Bienvenue à Twinsland</h1>

  <div class="ville-dropdown" id="villeDropdown">
    Sélectionner une ville
    <ul class="ville-options" id="villeOptions"></ul>
  </div>

  <div id="mapContainer">
    <img src="assets/images/map-benin.png" alt="Carte du Bénin" id="beninMap" />
    <div id="villeMarkers"></div>
  </div>

  <div class="music-player">
    <div class="player-info">
      <span id="track-name">Titre</span> | <span id="artist-name">Artiste</span>
    </div>
    <div class="player-controls">
      <button id="prev-btn">❮</button>
      <button id="play-btn">▶</button>
      <button id="next-btn">❯</button>
    </div>
    <audio id="audio"></audio>
  </div>

  <script src="script.js"></script>
</body>
</html>
